[package]
name = "democritus"
version = "0.1.0"
description = "Democritus: a private desktop AI assistant running on local Qwen models"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# No default features (no system proxy, no bundled TLS). `native-tls` uses the
# OS TLS stack (SChannel on Windows) and is used only by internet.rs for
# operator-approved downloads; the model client still refuses anything except
# plain http:// on loopback (llm::normalize_base_url).
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = { version = "=1.53.3", features = ["sync", "macros", "time"] }
# Checksums for approved downloads (already in the local cargo cache via Tauri).
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
